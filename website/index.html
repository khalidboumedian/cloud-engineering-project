
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Bundesliga football analytics dashboard with match results and statistics.">
    <title>Football Analytics | Bundesliga</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body>
    <header class="header">
        <div class="container">
            <h1>⚽ Football Analytics</h1>
            <p>Bundesliga Statistics & Match Results</p>
        </div>
    </header>

    <main class="container">
        <section class="dashboard">
            <div class="section-heading">
                <div>
                    <h2>League Overview</h2>
                    <p id="data-status">Loading football data...</p>
                </div>
            </div>

            <div class="stats-grid">
                <article class="stat-card">
                    <h3>Total Matches</h3>
                    <p id="total-matches">—</p>
                </article>

                <article class="stat-card">
                    <h3>Total Goals</h3>
                    <p id="total-goals">—</p>
                </article>

                <article class="stat-card">
                    <h3>Finished Matches</h3>
                    <p id="finished-matches">—</p>
                </article>
            </div>
        </section>

        <section class="matches-section">
            <div class="section-heading">
                <div>
                    <h2>Latest Match Results</h2>
                    <p>Recently completed Bundesliga matches</p>
                </div>
            </div>

            <div id="matches-container" class="matches-container">
                <p class="loading-message">Loading matches...</p>
            </div>
        </section>
    </main>

    <footer class="footer">
        <p>Football Analytics Platform | Built with AWS</p>
    </footer>
</body>
</html>
